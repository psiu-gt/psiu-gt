{{ define "main" }}
<section class="page">
  <header class="page-header">
    <img src="{{ "img/toplogo.png" | relURL }}" alt="Psi Upsilon Header">
    <img class="cogwheel" src="{{ "img/cogwheelbreak.png" | relURL }}" alt="Article divider">
    <h1>{{ .Title }}</h1>
    <em class="post-date">{{ .Date.Format "January 02, 2006" }}</em>
    <hr>
  </header>
  <main class="container content">
    {{ .Content }}
  </main>
</section>
{{ end }}
