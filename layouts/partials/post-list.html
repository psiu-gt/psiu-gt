{{/* Renders post cards for a page collection, e.g. (where .Site.RegularPages "Section" "posts") */}}
<div class="post-list">
  {{ range . }}
    <article class="post">
      <h2 class="post-title">{{ .Title }}</h2>
      <p class="post-date">{{ .Date.Format "January 02, 2006" }}</p>
      <p><em class="post-excerpt">{{ truncate 140 "…" .Plain }}</em></p>
      <a href="{{ .RelPermalink }}">Read More »</a>
    </article>
  {{ end }}
</div>
