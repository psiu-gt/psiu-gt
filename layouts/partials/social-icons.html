<div class="social-icons">
  {{ with .Site.Params.social }}
    {{ with .facebook }}<a class="social facebook" href="{{ . }}" aria-label="Facebook"><i class="fa fa-facebook"></i></a>{{ end }}
    {{ with .instagram }}<a class="social instagram" href="{{ . }}" aria-label="Instagram"><i class="fa fa-instagram"></i></a>{{ end }}
    {{ with .twitter }}<a class="social twitter" href="{{ . }}" aria-label="Twitter"><i class="fa fa-twitter"></i></a>{{ end }}
  {{ end }}
</div>
