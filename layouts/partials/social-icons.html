<div class="social-icons">
  {{ range .Site.Params.social }}
    {{ if and .url .icon }}
      <a class="social" href="{{ .url }}" aria-label="{{ .name | default .icon }}" target="_blank" rel="noopener noreferrer"{{ with .color }} style="--social-color: {{ . | safeCSS }}"{{ end }}><i class="fa-brands fa-{{ .icon }}"></i></a>
    {{ end }}
  {{ end }}
</div>
